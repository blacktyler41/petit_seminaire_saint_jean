<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Video</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* HERO SECTION */
.campus-hero {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* VIDEO (MORE VISIBLE) */
.hero-video {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 110%;
  height: 110%;
  transform: translate(-50%, -50%) scale(1.05);
  object-fit: cover;
  z-index: 1;

  /* 🔥 improved visibility */
  filter: brightness(1) contrast(1.1) saturate(1.1);

  pointer-events: none;
  transition: transform 6s ease;
}

/* smooth zoom on hover */
.campus-hero:hover .hero-video {
  transform: translate(-50%, -50%) scale(1.12);
}

/* LIGHT OVERLAY (almost invisible) */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 2;

  display: flex;
  justify-content: center;
  align-items: center;

  /* 🔥 very light overlay */
  background: rgba(0,0,0,0.15);
}

/* PLAY BUTTON (CENTER FOCUS) */
.play-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;

  background: rgba(255,255,255,0.95);
  color: black;
  font-size: 24px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

/* HOVER EFFECT */
.play-btn:hover {
  background: #0ea5e9;
  color: white;
  transform: scale(1.2);
}

/* SCROLL INDICATOR */
.scroll-indicator {
  position: absolute;
  bottom: 20px;
  z-index: 3;
  color: white;
  font-size: 14px;
  opacity: 0.8;

  animation: bounce 2s infinite;
}

/* ANIMATION */
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(10px); }
}

/* MOBILE */
@media (max-width: 768px) {
  .campus-hero {
    height: 65vh;
  }

  .play-btn {
    width: 55px;
    height: 55px;
    font-size: 18px;
  }

  .scroll-indicator {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<section class="campus-hero">

  <!-- VIDEO -->
  <video id="campusVideo" autoplay muted loop playsinline class="hero-video">
    <source src="static.mp4" type="video/mp4">
  </video>

  <!-- OVERLAY -->
  <div class="overlay">
    <button class="play-btn" onclick="playVideo()">▶</button>
  </div>

  <!-- SCROLL -->
  <div class="scroll-indicator">
    ↓ Scroll
  </div>

</section>

<script>
function playVideo() {
  const video = document.getElementById("campusVideo");
  const btn = document.querySelector(".play-btn");

  // enable sound and play
  video.muted = false;
  video.play();

  // hide play button after click
  btn.style.display = "none";
}
</script>

</body>
</html>
