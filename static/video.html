<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Video</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BACKGROUND (premium feel) */
body {
  background: #0a0a0a;
  font-family: Arial, sans-serif;
}

/* HERO */
.campus-hero {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 30px;
}

/* CONTAINER */
.container {
  width: 100%;
  max-width: 1000px;
}

/* VIDEO CARD */
.video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;

  border-radius: 16px;
  overflow: hidden;

  /* premium shadow */
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
}

/* VIDEO */
.hero-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* SOFT DARK OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.4)
  );
}

/* CONTROL BAR */
.controls {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 10px;

  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);

  padding: 8px 12px;
  border-radius: 50px;
}

/* BUTTONS */
.control-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;

  background: rgba(255,255,255,0.9);
  color: black;
  font-size: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  transition: all 0.3s ease;
}

/* Hover only desktop */
@media (hover: hover) {
  .control-btn:hover {
    background: #0ea5e9;
    color: white;
    transform: scale(1.1);
  }
}

/* MOBILE */
@media (max-width: 768px) {
  .control-btn {
    width: 35px;
    height: 35px;
    font-size: 16px;
  }
}

@media (max-width: 480px) {
  .controls {
    bottom: 10px;
  }

  .control-btn {
    width: 30px;
    height: 30px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<section class="campus-hero">
  <div class="container">

    <div class="video-wrapper">
      <video id="campusVideo"
             autoplay
             muted
             loop
             playsinline
             class="hero-video">
        <source src="static.mp4" type="video/mp4">
      </video>

      <div class="overlay"></div>

      <!-- CONTROLS -->
      <div class="controls">
        <button class="control-btn" onclick="togglePlay()">❚❚</button>
        <button class="control-btn" onclick="toggleSound()">🔇</button>
      </div>

    </div>

  </div>
</section>

<script>
const video = document.getElementById("campusVideo");
const playBtn = document.querySelectorAll(".control-btn")[0];
const soundBtn = document.querySelectorAll(".control-btn")[1];

function togglePlay() {
  if (video.paused) {
    video.play();
    playBtn.textContent = "❚❚";
  } else {
    video.pause();
    playBtn.textContent = "▶";
  }
}

function toggleSound() {
  video.muted = !video.muted;

  if (video.muted) {
    soundBtn.textContent = "🔇";
  } else {
    soundBtn.textContent = "🔊";
  }
}
</script>

</body>
</html>
