<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Video</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --brand: #0ea5e9;
  --brand-dark: #0369a1;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: conic-gradient(
    from 90deg,
    var(--brand),
    white,
    var(--brand-dark)
  );
  background-size: 200% 200%;
}





.home-button {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.85rem 1.2rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  color: #000000;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.campus-hero {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 20px;
}

.container {
  width: 100%;
  max-width: 1000px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.video-wrapper {
  position: relative;
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 16 / 9;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
  margin: 0 auto;
}

.hero-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.4)
  );
}

.controls {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  padding: 8px 12px;
  border-radius: 50px;
}

.control-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.9);
  color: black;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
}

@media (hover: hover) {
  .control-btn:hover {
    background: var(--brand);
    color: white;
    transform: scale(1.1);
  }
}

@media (max-width: 768px) {
  .control-btn {
    width: 35px;
    height: 35px;
    font-size: 16px;
  }
}

@media (max-width: 480px) {
  .campus-hero {
    padding: 20px 12px;
  }

  .controls {
    bottom: 10px;
  }

  .control-btn {
    width: 30px;
    height: 30px;
    font-size: 14px;
  }
}
html, body {
  overflow-x: hidden;
}
</style>
</head>

<body>

<a class="home-button" href="index.html">Home</a>

<section class="campus-hero">
  <div class="container">

    <div class="video-wrapper">
      <video id="campusVideo"
             autoplay
             muted
             loop
             playsinline
             class="hero-video">
        <source src="Assets/Welcome to Petit Séminaire Saint-Jean Nkumba.mp4" type="video/mp4">
      </video>

      <div class="overlay"></div>

      <!-- CONTROLS -->
      <div class="controls">
        <button class="control-btn" onclick="togglePlay()">❚❚</button>
        <button class="control-btn" onclick="toggleSound()">🔇</button>
      </div>

    </div>

  </div>
</section>

<script>
const video = document.getElementById("campusVideo");
const playBtn = document.querySelectorAll(".control-btn")[0];
const soundBtn = document.querySelectorAll(".control-btn")[1];

function togglePlay() {
  if (video.paused) {
    video.play();
    playBtn.textContent = "❚❚";
  } else {
    video.pause();
    playBtn.textContent = "▶";
  }
}

function toggleSound() {
  video.muted = !video.muted;

  if (video.muted) {
    soundBtn.textContent = "🔇";
  } else {
    soundBtn.textContent = "🔊";
  }
}
</script>

</body>
</html>
